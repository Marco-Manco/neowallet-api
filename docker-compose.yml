services:
  postgres:
    image: postgres:15-alpine
    container_name: neowallet-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: neowallet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: neowallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  bullmq-board:
    image: queuingio/bull-board:latest
    container_name: neowallet-bullmq-board
    ports:
      - "3001:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - BULL_PREFIX=bull
      - BULLMQ_QUEUES=email-notifications,transaction-receipts
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
